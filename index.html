<html lang="es">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}
:root{--display:Georgia,"Times New Roman",serif;--navy:#243957}
body{margin:0;background:#f2f0ee;color:#172033;font-size:16px;line-height:1.4;caret-color:#243957;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:#f2f0ee;color:#172033;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:2px solid var(--navy);max-width:1100px;margin:0 auto}
.brand{font-family:var(--display);font-variant:small-caps;font-weight:700;font-size:14px;letter-spacing:.1em;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand svg{width:12px;height:12px;flex:none}
header .top{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:1.5rem;font-family:var(--display);color:var(--navy)}
header p{margin:6px 0 0;color:#525c6e;font-size:.95rem;line-height:1.4}
.back{font:inherit;font-size:15px;min-height:44px;background:#fff;color:#172033;border:1px solid #d5dce8;border-radius:999px;padding:7px 14px;cursor:pointer}
main{max-width:1100px;margin:auto;padding:14px}
.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab,.action{font:inherit;cursor:pointer;border:1px solid #cbd3e1;background:#fff;border-radius:10px;padding:10px 14px;color:#172033;min-height:48px;font-size:16px}
.tab.active{background:#243957;color:#fff;border-color:#243957}
.action.primary{background:#243957;color:#fff;border-color:#243957;font-weight:600}
.action.send{background:#1f7a52;color:#fff;border-color:#1f7a52;font-weight:700}
.action.danger{color:#b42318;border-color:#e6b4b4}
.action:disabled{opacity:.5;cursor:default}
.filters input{font:inherit;padding:11px;border:1px solid #cbd3e1;border-radius:10px;flex:1;min-width:180px}
.summary{background:#fff;border:1px solid #e0e5ed;border-radius:12px;padding:12px;margin-bottom:14px;position:sticky;top:0;z-index:4;box-shadow:0 4px 12px rgba(23,32,51,.08)}
.summary .tt span{font-weight:700;font-size:1.05rem}
.summary .tt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.chipsum{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chipsum span{font-size:.92rem;border-radius:20px;padding:4px 10px;background:#eef1f6}
.chipsum .p{background:#e3f4ea;color:#187247}.chipsum .t{background:#fdebd9;color:#a14a08}.chipsum .a{background:#fde4e4;color:#b42318}.chipsum .c{background:#fbf1d6;color:#7a5900}
.progress{height:7px;background:#e6eaf0;border-radius:8px;overflow:hidden;width:100%;margin-top:9px}
.bar{height:100%;background:#2d8a63;width:0}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.group{background:#fff;border:1px solid #dce2eb;border-radius:14px;padding:13px}
.grouphead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}
.grouphead h2{font-size:1.1rem;margin:0;font-family:var(--display);color:var(--navy)}
.grouphead span{font-size:.9rem;color:#525c6e;text-align:right}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.person-wrap{min-width:0;display:flex;flex-direction:column;gap:4px}
.person{min-width:0;width:100%;min-height:44px;border:1px solid #c3ccda;border-radius:10px;padding:7px 4px;background:#fff;cursor:pointer;text-align:center;color:#172033;font:inherit}
.person img,.person .ph{width:100%;height:88px;object-fit:contain;display:block;background:#f6f7f9;border-radius:6px;margin-bottom:5px}
.person .ph{display:grid;place-items:center;font-size:1.2rem;font-weight:700;color:#5b667a}
.person .name{font-size:.88rem;font-weight:650;line-height:1.15;display:block;overflow-wrap:anywhere;min-height:2.2em}
.person .room{font-size:.8rem;color:#525c6e;display:block;margin-top:2px}
.person .status{font-size:.84rem;font-weight:600;display:block;margin-top:4px;color:#525c6e}
.person.present{border-color:#62ad88;background:#effaf4}.person.present .status{color:#187247}
.person.late{border-color:#e08a3c;background:#fff4ea}.person.late .status{color:#b4520b;font-weight:600}
.person.absent{border-color:#d98989;background:#fff0f0}.person.absent .status{color:#b42318}
.person.course{border-color:#d6b45b;background:#fff9e8}.person.course .status{color:#8a6500}
.absence-reason{width:100%;min-height:44px;font:inherit;font-size:.85rem;border:1px solid #d98989;border-radius:7px;padding:5px 2px;background:#fff;color:#7f1d1d}
.late-time{width:100%;min-height:44px;font:inherit;font-size:.9rem;border:1px solid #e08a3c;border-radius:7px;padding:4px 2px;background:#fff;color:#7a3a07;text-align:center}
.print-label{display:none;font-size:.68rem;font-weight:700;margin-top:3px;color:#8b1e1e}
.vacant{border:1px dashed #e0e5ed;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#5b667a;font-size:.9rem;min-height:130px}
.libres{margin:10px 0 0;font-size:.92rem;color:#525c6e;border-top:1px dashed #d5dce8;padding-top:8px}
details.mas{margin-top:4px}details.mas summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;color:#243957}
details.mas .row{margin-top:6px}
.action.avi{background:#a1401f;color:#fff;border-color:#a1401f;font-weight:700}
.sendbox{margin:18px 0 6px;background:#fff;border:1px solid #cfe5d9;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sendbox .action.send{padding:14px;font-size:1.02rem}
.small{font-size:.95rem;color:#5b667a;line-height:1.4}
.aviso{background:#fdf1e3;border:1px solid #e3b98a;color:#6e3507;border-radius:12px;padding:12px 14px;margin:0 0 12px;line-height:1.4}
.ok{color:#187247;font-weight:600}.bad{color:#b42318;font-weight:600}
.card{background:#fff;border:1px solid #e0e5ed;border-radius:14px;padding:14px;margin-top:14px}
.card h3{margin:0 0 8px;font-size:1.05rem;font-family:var(--display);color:var(--navy)}
.home-btns{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.hb{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;background:#fff;border:1px solid #d5dce8;border-left:6px solid #243957;border-radius:16px;padding:18px 16px;cursor:pointer;color:#172033}
.hb.cas{border-left-color:#2e6b5e}
.hb .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:#e8edf6;color:#243957;flex:none}
.hb.cas .ic{background:#e2f0ec;color:#2e6b5e}
.hb.avi{border-left-color:#a1401f}.hb.avi .ic{background:#fbe9e1;color:#a1401f}
.avlist{display:flex;flex-direction:column;gap:8px}
.av-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;font:inherit;background:#fff;border:1px solid #d5dce8;border-radius:12px;padding:10px 12px;cursor:pointer;color:#172033}
.av-row .nm{flex:1;min-width:0}.av-row .nm b{display:block;font-size:1rem}.av-row .nm span{font-size:.88rem;color:#525c6e}
.av-cnt{text-align:right;white-space:nowrap;font-size:.9rem;color:#525c6e}.av-cnt b{font-size:1.05rem;color:#172033}
.av-cnt.par b{color:#a1401f}
.dots{display:inline-flex;gap:4px;margin-top:4px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid #a1401f;display:inline-block}.dots i.on{background:#a1401f}
.av-sel{border:2px solid #a1401f;border-radius:14px;background:#fff;padding:14px;margin-bottom:14px}
.av-sel h2{margin:0 0 4px;font-size:1.2rem}
.av-hist{list-style:none;margin:10px 0;padding:0}.av-hist li{padding:8px 0;border-bottom:1px solid #edf0f5;font-size:.95rem}.av-hist li:last-child{border:0}
.pend{color:#a14a08;font-weight:600}
.hb b{display:block;font-size:1.2rem;font-family:var(--display);color:var(--navy)}.hb .s{font-size:.95rem;color:#525c6e}.hb .go{margin-left:auto;font-size:1.6rem;color:#5b667a}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:.92rem;font-weight:600;color:#4a5568}
.field input,.field select,.field textarea{font:inherit;font-size:16px;min-height:44px;padding:10px;border:1px solid #cbd3e1;border-radius:10px;background:#fff}
.field textarea{min-height:110px;resize:vertical}
details.card summary{font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--display);color:var(--navy);font-size:1.05rem}
.libres,.brand{}
details.card[open] summary{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0}.hist li{padding:8px 0;border-bottom:1px solid #edf0f5;font-size:.95rem}.hist li:last-child{border:0}
.toast{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;top:calc(10px + env(safe-area-inset-top,0px));background:#172033;color:#fff;padding:11px 16px;border-radius:14px;font-size:1rem;z-index:50;max-width:92vw;box-shadow:0 6px 20px #0004;display:flex;align-items:center;gap:12px}
.toast[hidden]{display:none}
.toast button{font:inherit;font-weight:700;background:#fff;color:#172033;border:0;border-radius:9px;padding:8px 14px;min-height:44px;cursor:pointer}
:focus-visible{outline:3px solid #2f6fdb;outline-offset:2px}
::selection{background:#c9d8f2;color:#172033}
@media(max-width:520px){header{padding-left:12px;padding-right:12px}main{padding:10px}.groups{grid-template-columns:1fr}.person img,.person .ph{height:clamp(72px,23vw,110px)}.tab,.action{padding:10px 10px;font-size:15px}}
@media print{header{background:#fff;color:#000;padding:0 0 10px}header p,.back{display:none}.tabs,.filters,.sendbox,.no-print,.toast{display:none!important}main{padding:0}.groups{grid-template-columns:repeat(2,1fr)}.group,.person-wrap,.vacant{break-inside:avoid}
body.print-absent .summary,body.print-absent .person-wrap:not(.print-me),body.print-absent .vacant,body.print-absent .group:not(:has(.print-me)){display:none!important}
body.print-absent .absence-reason,body.print-absent .late-time,body.print-absent .libres{display:none!important}body.print-absent .print-label{display:block!important}
body.print-absent header h1:after{content:" — AUSENTES NO JUSTIFICADOS Y TARDES"}}
</style>
</head>
<body>
<header><div class="brand"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M5 0h2v4h4v2H7v6H5V6H1V4h4z" fill="currentColor"/></svg>Monasterio La Santa Espina</div><div class="top"><button class="back" data-act="inicio" id="btnBack" hidden>‹ Inicio</button><h1 id="titulo">Pasar Lista</h1></div><p id="sub"></p></header>
<main id="main"></main>
<input type="file" id="fichero" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
"use strict";
/* ---------- residentes guardados en el móvil (IndexedDB) ---------- */
const DBN='pasarListaHabitaciones', ST='kv';
function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});}
async function dbGet(k){const d=await idb();return new Promise((ok,ko)=>{const r=d.transaction(ST).objectStore(ST).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});}
async function dbSet(k,v){const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);});}
async function dbDel(k){const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).delete(k);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);});}

/* ---------- estado en localStorage ---------- */
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const K={hab:['attendanceRoomStates','attendanceAbsenceReasons','attendanceLateTimes'],cas:['casas_states','casas_reasons','casas_late']};
const S={};for(const m of ['hab','cas'])S[m]={states:LS.get(K[m][0],{}),reasons:LS.get(K[m][1],{}),late:LS.get(K[m][2],{})};
function guardarEstado(m){LS.set(K[m][0],S[m].states);LS.set(K[m][1],S[m].reasons);LS.set(K[m][2],S[m].late);LS.set('pl_ts_'+m,Object.keys(S[m].states).length?Date.now():0);}
const marcasDe=m=>Object.keys(S[m].states).length, tsMarcas=m=>LS.get('pl_ts_'+m,0);
function marcasViejas(m){ const n=marcasDe(m); if(!n) return false; const ts=tsMarcas(m); return !ts||Date.now()-ts>5*3600e3; }
let H=null, C=null;                       // {habitaciones,cargado} · {casas,cargado}
const UI={sigue:{},modo:LS.get('pl_modo',null),tab:{hab:LS.get('pl_tab_hab','1'),cas:LS.get('pl_tab_cas','0')},q:''};
const ENV=LS.get('pl_envio',{url:'',clave:'',movil:''});
let COLA=LS.get('pl_cola',[]), HIST=LS.get('pl_hist',[]);
let AV=LS.get('pl_avisos',{lista:[],porParte:3,t:0});
const guardarEnvio=()=>{LS.set('pl_envio',ENV);LS.set('pl_cola',COLA);LS.set('pl_hist',HIST);};

const MOT={unjustified:'No justificado',justified:'Justificado',home:'En casa'};
const MOT_CORTO={unjustified:'No justif.',justified:'Justific.',home:'En casa'};
const EST={present:'Presente',late:'Llegó tarde',absent:'Ausente',course:'En un curso',pending:'Pendiente'};
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const corto=c=>String(c).replace(/^Casa\s+/,'').replace('San Juan Bautista de la Salle','La Salle').replace('San Juan Pablo II','Juan Pablo II');
const iniciales=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const ahora=()=>new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(t,acc,fn){const e=document.getElementById('toast');e.textContent='';const sp=document.createElement('span');sp.textContent=t;e.appendChild(sp);
  if(acc&&fn){const b=document.createElement('button');b.type='button';b.textContent=acc;b.dataset.toast='1';b.onclick=ev=>{ev.stopPropagation();e.hidden=true;fn();};e.appendChild(b);}
  e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,acc?3500:2800);}

/* ---------- listas ---------- */
const PLANTA=r=>String(r).startsWith('2')?'1':String(r).startsWith('3')?'2':'otra';
function pestanas(m){
  if(m==='hab') return [['1','1.ª planta · 201–212'],['2','2.ª planta · 301–312'],['all','Todas']];
  return C.casas.map((c,i)=>[String(i),corto(c.casa)]).concat([['all','Todas']]);
}
function ambito(m,t){
  if(m==='hab') return t==='all'?'Todas las habitaciones':t==='1'?'1.ª planta':'2.ª planta';
  return t==='all'?'Todas las casas':(C.casas[+t]||{}).casa||'';
}
function grupos(m,t){
  if(m==='hab'){
    return H.habitaciones.filter(r=>t==='all'||PLANTA(r.habitacion)===t).map(r=>({h2:'Habitación '+r.habitacion,sub:r.curso||'',
      slots:r.people.map(p=>p?{key:r.habitacion+'|'+p.name,name:p.name,full:p.full||'',photo:p.photo,hab:String(r.habitacion),curso:r.curso||'',grupo:(PLANTA(r.habitacion)==='1'?'1.ª planta':'2.ª planta')}:null)}));
  }
  const out=[];
  C.casas.forEach((c,i)=>{ if(t!=='all'&&String(i)!==t) return;
    const gs=[]; c.people.forEach(p=>{const k=t==='all'?corto(c.casa):(p.curso||'Sin curso');let g=gs.find(x=>x.k===k);if(!g){g={k,ps:[]};gs.push(g);}g.ps.push(p);});
    gs.forEach(g=>out.push({h2:g.k,sub:`${g.ps.length} ${g.ps.length===1?'persona':'personas'}`,
      slots:g.ps.map(p=>({key:c.casa+'|'+p.name,name:p.name,full:p.full||'',photo:p.photo,hab:p.habitacion||'',curso:p.curso||'',grupo:c.casa}))}));
  });
  return out;
}
function contar(m,t){
  const r={total:0,presentes:0,tarde:0,ausentes:0,nojust:0,just:0,casa:0,curso:0,pendientes:0};
  for(const g of grupos(m,t)) for(const p of g.slots){ if(!p) continue; r.total++;
    const s=S[m].states[p.key]||'pending';
    if(s==='present')r.presentes++;else if(s==='late')r.tarde++;else if(s==='course')r.curso++;
    else if(s==='absent'){r.ausentes++;const mo=S[m].reasons[p.key]||'unjustified';if(mo==='justified')r.just++;else if(mo==='home')r.casa++;else r.nojust++;}
    else r.pendientes++; }
  return r;
}

/* ---------- pantallas ---------- */
function render(){
  const m=UI.modo&&((UI.modo==='hab'&&H)||(UI.modo==='cas'&&C)||(UI.modo==='avi'&&(H||C)))?UI.modo:null;
  UI.modo=m; LS.set('pl_modo',m);
  document.getElementById('btnBack').hidden=!m;
  if(!m) return renderInicio();
  if(m==='avi') return renderAvisos();
  renderLista(m);
}
function renderInicio(){
  document.getElementById('titulo').textContent='Pasar Lista';
  document.getElementById('sub').textContent='Elige cómo vas a pasar lista.';
  const nH=H?H.habitaciones.reduce((a,h)=>a+h.people.filter(Boolean).length,0):0, nC=C?C.casas.reduce((a,c)=>a+c.people.length,0):0;
  const pend=COLA.filter(x=>!x.obs).length;
  let h=`<div class="home-btns">
    <button class="hb" data-abrir="hab"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v15"/><path d="M15 9h4a1 1 0 0 1 1 1v10"/><path d="M2 20h20"/><circle cx="12" cy="13" r=".8" fill="currentColor"/></svg></span>
      <span><b>Por habitaciones</b><span class="s">${H?`${nH} residentes · ${H.habitaciones.length} habitaciones`:'Sin residentes: toca para cargar el archivo'}</span></span><span class="go">›</span></button>
    <button class="hb cas" data-abrir="cas"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></span>
      <span><b>Por casas</b><span class="s">${C?`${nC} residentes · ${C.casas.length} casas`:'Sin residentes: toca para cargar el archivo'}</span></span><span class="go">›</span></button>
    <button class="hb avi" data-abrir="avi"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".8" fill="currentColor"/></svg></span>
      <span><b>Avisos de parte</b><span class="s">${resumenAvisosTxt()}</span></span><span class="go">›</span></button>
  </div>`;
  // últimos envíos
  h+=`<div class="card"><h3>Pases enviados por correo</h3>`;
  if(pend) h+=`<p class="small bad">${pend} ${pend===1?'pase pendiente':'pases pendientes'} de enviar. Se mandarán solos en cuanto haya internet.</p><div class="row" style="margin-bottom:8px"><button class="action" data-act="reintentar">Enviar ahora</button></div>`;
  if(HIST.length) h+='<ul class="hist">'+HIST.slice(0,6).map(x=>`<li><b>${new Date(x.fecha).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</b> · ${esc(x.lista)} · ${esc(x.ambito)}<br><span class="small">${x.presentes} presentes · ${x.ausentes} ausentes · ${x.tarde} tarde — ${x.enviado?'<span class="ok">enviado ✓</span>':'<span class="bad">pendiente</span>'}</span></li>`).join('')+'</ul>';
  else h+=`<p class="small">Cuando termines un pase, pulsa <b>Enviar pase por correo</b> y llegará un Excel con los ausentes y los totales a c.pardo@educatioservanda.org.</p>`;
  h+=`</div>`;
  // configuración del envío
  const on=ENV.url&&ENV.clave;

/* ---------- pase: Excel (CSV) y envío ---------- */
function construirPase(){
  const m=UI.modo,t=UI.tab[m],st=S[m],filas=[];
  for(const g of grupos(m,t)) for(const p of g.slots){ if(!p) continue; const s=st.states[p.key]||'pending';
    if(s==='absent'||s==='late'||s==='pending') filas.push({grupo:m==='hab'?g.h2:corto(p.grupo),hab:p.hab,curso:p.curso,nombre:p.full||p.name,estado:EST[s],motivo:s==='absent'?MOT[st.reasons[p.key]||'unjustified']:'',hora:s==='late'?(st.late[p.key]||''):''}); }
  return {id:uid()+uid(),lista:m==='hab'?'Habitaciones':'Casas',ambito:ambito(m,t),fecha:Date.now(),totales:contar(m,t),filas};
}
function descargarCSV(){
  const m=UI.modo,t=UI.tab[m],st=S[m],d=new Date(),z=n=>String(n).padStart(2,'0');
  const fecha=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,hora=`${z(d.getHours())}:${z(d.getMinutes())}`;
  const c=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const filas=[['Fecha','Hora del pase',m==='hab'?'Planta':'Casa','Habitación','Curso','Nombre','Estado','Motivo ausencia','Hora de llegada']];
  for(const g of grupos(m,t)) for(const p of g.slots){ if(!p) continue; const s=st.states[p.key]||'pending';
    filas.push([fecha,hora,m==='hab'?p.grupo:corto(p.grupo),p.hab,p.curso,p.full||p.name,EST[s],s==='absent'?MOT[st.reasons[p.key]||'unjustified']:'',s==='late'?(st.late[p.key]||''):'']); }
  const txt='﻿'+filas.map(f=>f.map(c).join(';')).join('\r\n')+'\r\n';
  const sufijo=m==='hab'?(t==='all'?'habitaciones':'planta'+t):(t==='all'?'casas':norm(corto(C.casas[+t].casa)).replace(/[^a-z0-9]+/g,'-'));
  const url=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=`pase_${fecha}_${hora.replace(':','')}_${sufijo}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
let enviando=false;
async function post(cuerpo){
  const ac=window.AbortController?new AbortController():null, to=ac?setTimeout(()=>ac.abort(),45000):0;
  try{ const r=await fetch(ENV.url.trim(),{method:'POST',body:JSON.stringify(Object.assign({clave:ENV.clave.trim(),movil:(ENV.movil||'').trim()||'Sin nombre'},cuerpo)),signal:ac?ac.signal:undefined});
    return await r.json(); } finally { clearTimeout(to); }
}
async function enviarCola(){
  if(enviando||!COLA.length||!ENV.url||!ENV.clave||navigator.onLine===false) return;
  enviando=true; let n=0;
  try{
    while(COLA.length){
      const it=COLA[0]; let res;
      try{ res=await post(it.obs?{tipo:'observacion',id:it.id,obs:it.obs}:it.aviso?{tipo:'aviso',id:it.id,aviso:it.aviso}:it.anular?{tipo:'anularAviso',id:it.id,ref:it.anular}:{tipo:'pase',id:it.id,pase:it}); }catch(e){ break; }
      if(res&&res.ok){ COLA.shift(); const h=HIST.find(x=>x.id===it.id); if(h) h.enviado=true; if(res.avisos) guardarAvisos(res);
        if(it.obs) toast('Observación enviada. ¡Gracias!'); else if(!it.aviso&&!it.anular) n++; guardarEnvio(); }
      else { const msg=res&&res.error==='clave'?'La clave del envío no es correcta. Revísala en Inicio.':'El servicio de correo ha dado un error. Se reintentará.'; if(enviarCola.ult!==msg||Date.now()-(enviarCola.t||0)>15*60e3){ toast(msg); enviarCola.ult=msg; enviarCola.t=Date.now(); } break; }
    }
  } finally { enviando=false; if(n) toast(n===1?'Pase enviado por correo ✓':`${n} pases enviados por correo ✓`); if(!UI.modo||UI.modo==='avi') render(); }
}
function enviarPase(){
  if(!ENV.url||!ENV.clave){ toast('Primero configura el envío en la pantalla de inicio.'); return; }
  if(marcasViejas(UI.modo)&&!confirm('Las marcas de esta lista son de hace más de 5 horas. ¿Seguro que son del pase de ahora?')) return;
  const p=construirPase(), T=p.totales;
  if(T.pendientes&&!confirm(`Quedan ${T.pendientes} sin pasar. Se enviarán como «Pendiente». ¿Enviar igualmente?`)) return;
  if(!confirm(`¿Enviar el pase de ${p.ambito}?\n\n${T.presentes+T.tarde} presentes (${T.tarde} tarde)\n${T.ausentes} ausentes (${T.nojust} no justificados)\n${T.curso} en un curso`)) return;
  COLA.push(p); HIST.unshift({id:p.id,fecha:p.fecha,lista:p.lista,ambito:p.ambito,presentes:T.presentes+T.tarde,ausentes:T.ausentes,tarde:T.tarde,enviado:false}); HIST=HIST.slice(0,20); guardarEnvio();
  if(navigator.onLine===false) toast('Sin internet: el pase se enviará solo cuando haya conexión.'); else toast('Enviando pase…');
  enviarCola();
}
async function probar(){
  ['movil','url','clave'].forEach(k=>{const e=document.getElementById('env_'+k); if(e) ENV[k]=e.value.trim();}); guardarEnvio();
  const box=document.getElementById('envRes');
  if(!ENV.url||!ENV.clave){ box.className='small bad'; box.textContent='Pega la dirección y la clave.'; return; }
  box.className='small'; box.textContent='Probando…';
  try{ const r=await post({prueba:true});

    else { box.className='small bad'; box.textContent=r&&r.error==='clave'?'La clave no es correcta.':'El servicio ha respondido con un error.'; }
  }catch(e){ box.className='small bad'; box.textContent='No se pudo conectar. Revisa la dirección y que haya internet.'; }

function personasTodas(){

  if(C) C.casas.forEach(c=>c.people.forEach(p=>{ const n=p.full||p.name, k=claveN(n);
    const ya=[...m.values()].find(x=>{ const a=x.k.split(' '), b=k.split(' '); return a.every(w=>b.includes(w))||b.every(w=>a.includes(w)); });
    if(ya){ ya.casa=corto(c.casa); if(!ya.curso) ya.curso=p.curso||''; if(!ya.photo) ya.photo=p.photo; }
    else m.set(k,{k,nombre:n,hab:p.habitacion||'',curso:p.curso||'',casa:corto(c.casa),photo:p.photo}); }));
  return [...m.values()];

function datosAviso(k){
  const s=(AV.lista||[]).find(x=>claveN(x.nombre)===k)||{n:0,ult:[]};
  const pend=COLA.filter(x=>x.aviso&&claveN(x.aviso.nombre)===k), anul=new Set(COLA.filter(x=>x.anular).map(x=>x.anular));

  const n=ult.length<(s.ult||[]).length?s.n-((s.ult||[]).length-ult.length):s.n;
  return {n:n+pend.length,pend,ult};

function ponerAviso(){
  const P=AV.porParte||3, sel=personasTodas().find(p=>p.k===UI.avSel); if(!sel) return;

  if(motivo==='Otro'&&!nota){ toast('Con «Otro», explica el motivo en la nota'); document.getElementById('avNota').focus(); return; }
  const n=datosAviso(sel.k).n+1, parte=n%P===0;
  if(!confirm(`¿Poner un aviso a ${sel.nombre}?\n\nMotivo: ${motivo}${nota?'\nNota: '+nota:''}\n\nSerá su aviso n.º ${n} del curso.${parte?`\n\nATENCIÓN: con este aviso suma su parte n.º ${n/P}.`:''}`)) return;
  LS.set('pl_quien',quien);
  const it={id:uid()+uid(),aviso:{nombre:sel.nombre,hab:sel.hab,casa:sel.casa,curso:sel.curso,motivo,nota:nota.slice(0,500),quien:quien.slice(0,60),fecha:Date.now()}};
  COLA.push(it); guardarEnvio();
  UI.avNota=''; UI.avMot=null; UI.avQuien=null; render();
  toast(parte?`Aviso puesto: ${sel.nombre} suma un parte`:`Aviso puesto a ${sel.nombre} (${n})`,'Deshacer',()=>{
    const i=COLA.findIndex(x=>x.id===it.id);
    if(i>=0) COLA.splice(i,1); else COLA.push({id:uid()+uid(),anular:it.id});
    guardarEnvio(); render(); toast('Aviso quitado'); if(i<0) enviarCola(); });
  enviarCola();
}

/* ---------- lista de residentes desde la hoja de Google ---------- */
let sincronizando=false;
function mapaFotos(){
  const m=new Map(), add=(n,f)=>{ if(n&&f) m.set(claveN(n),f); };
  if(H) H.habitaciones.forEach(r=>r.people.forEach(p=>{ if(p){ add(p.full,p.photo); add(p.name,p.photo); } }));
  if(C) C.casas.forEach(c=>c.people.forEach(p=>{ add(p.full,p.photo); add(p.name,p.photo); }));
  return m;
}
function fotoDe(M,full,name){
  let f=M.get(claveN(full||''))||M.get(claveN(name||'')); if(f) return f;
  const t=claveN(full||name||'').split(' ').filter(Boolean); if(t.length<2) return undefined;
  const c=[...M.keys()].filter(k=>{ const q=k.split(' '); return t.every(w=>q.includes(w))||(q.length>=2&&q.every(w=>t.includes(w))); });
  return c.length===1?M.get(c[0]):undefined;
}
async function sincronizarResidentes(manual){
  if(sincronizando) return;
  if(!ENV.url||!ENV.clave){ if(manual) toast('Primero configura el envío por correo (más abajo).'); return; }
  if(navigator.onLine===false){ if(manual) toast('Sin internet: se usa la última lista guardada.'); return; }
  sincronizando=true; if(manual) toast('Descargando la lista de residentes…');
  try{
    const r=await post({tipo:'residentes'});
    if(!r||!r.ok){ if(manual) toast(r&&r.error==='clave'?'La clave del envío no es correcta.':'No se pudo descargar la lista. Se usa la guardada.'); return; }
    if(!Array.isArray(r.habitaciones)||!r.habitaciones.length){ if(manual) toast('La hoja de residentes está vacía: se mantiene la lista guardada.'); return; }
    const M=mapaFotos(), ts=Date.now();
    const habitaciones=r.habitaciones.map(h=>({habitacion:h.habitacion,curso:h.curso||'',people:h.people.map(p=>p?Object.assign({},p,{photo:fotoDe(M,p.full,p.name)}):null)}));
    const casas=(r.casas||[]).map(c=>({casa:c.casa,people:c.people.map(p=>Object.assign({},p,{photo:fotoDe(M,p.full,p.name)}))}));
    H={tipo:'habitaciones-santa-espina',habitaciones,cargado:ts,origen:'hoja'}; await dbSet('datos',H);
    if(casas.length){ C={tipo:'casas-santa-espina',casas,cargado:ts,origen:'hoja'}; await dbSet('casas',C); }
    LS.set('pl_sync',ts);
    if(!UI.modo||UI.modo==='avi') render(); else if(manual) render();
    if(manual) toast(`Lista actualizada: ${habitaciones.reduce((a,h)=>a+h.people.filter(Boolean).length,0)} en habitaciones`);
  }catch(e){ if(manual) toast('No se pudo conectar. Se usa la última lista guardada.'); }
  finally{ sincronizando=false; }
}

/* ---------- carga del archivo de residentes ---------- */
async function cargarArchivo(f){
  try{
    const d=JSON.parse(await f.text()), ts=Date.now(); let nH=0,nC=0;
    const hab=d&&(d.tipo==='pasar-lista-santa-espina'||d.tipo==='habitaciones-santa-espina')&&Array.isArray(d.habitaciones)?d.habitaciones:null;
    const cas=d&&(d.tipo==='pasar-lista-santa-espina'||d.tipo==='casas-santa-espina')&&Array.isArray(d.casas)?d.casas:null;
    if(!hab&&!cas) throw new Error('formato');
    if(hab){ H={tipo:'habitaciones-santa-espina',habitaciones:hab,cargado:ts}; await dbSet('datos',H); nH=hab.reduce((a,h)=>a+h.people.filter(Boolean).length,0); }
    if(cas){ C={tipo:'casas-santa-espina',casas:cas,cargado:ts}; await dbSet('casas',C); nC=cas.reduce((a,c)=>a+c.people.length,0); }
    render();
    alert('Residentes cargados.'+(nH?`\nHabitaciones: ${nH} personas.`:'')+(nC?`\nCasas: ${nC} personas.`:''));
  }catch(e){ alert('Ese archivo no es el de residentes. Elige residentes-santa-espina.json.'); }
}
async function abrir(m){
  if(!H&&!C&&ENV.url&&ENV.clave&&navigator.onLine!==false){ await sincronizarResidentes(true); }
  if(m==='avi'){ if(!H&&!C){ alert('Todavía no hay lista de residentes. Configura el envío por correo para descargarla, o carga el archivo residentes-santa-espina.json.'); return; }
    UI.modo='avi'; UI.qa=''; UI.avSel=null; render(); window.scrollTo(0,0); consultarAvisos(); return; }
  if((m==='hab'&&!H)||(m==='cas'&&!C)){ alert('Todavía no hay lista de residentes. Configura el envío por correo para descargarla, o carga el archivo residentes-santa-espina.json.'); return; }
  UI.modo=m; UI.q=''; render(); window.scrollTo(0,0);
}

/* ---------- sugerencias ---------- */
const OBS={tipo:'Cambio o mejora',texto:'',nombre:''};
function enviarObs(){
  const t=OBS.texto.trim(); if(!t){ toast('Escribe la observación'); return; }
  if(!ENV.url||!ENV.clave){ toast('Primero configura el envío por correo (más abajo).'); return; }
  COLA.push({id:uid()+uid(),obs:{app:'Pasar Lista',tipo:OBS.tipo,texto:t.slice(0,3000),nombre:OBS.nombre.trim().slice(0,60),fecha:Date.now()}});
  OBS.texto=''; UI.obsAbierto=false; guardarEnvio(); render();
  toast(navigator.onLine===false?'Sin internet: se enviará en cuanto haya conexión':'Enviando observación…'); enviarCola();
}
document.addEventListener('toggle',e=>{ if(e.target.id==='obsBox') UI.obsAbierto=e.target.open; if(e.target.id==='cfg') UI.cfgAbierto=e.target.open; },true);

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.abrir){ abrir(b.dataset.abrir); return; }
  if(b.dataset.avsel!=null){ UI.avSel=b.dataset.avsel; UI.avNota=''; UI.avMot=null; UI.avQuien=null; render(); window.scrollTo(0,0); return; }
  if(b.dataset.tab!=null){ UI.tab[UI.modo]=b.dataset.tab; LS.set('pl_tab_'+UI.modo,b.dataset.tab); render(); window.scrollTo(0,0); return; }
  if(b.classList.contains('person')){
    const m=UI.modo,k=b.dataset.key,st=S[m],s=st.states[k]||'pending';
    const nx={pending:'present',present:'late',late:'absent',absent:'course',course:'pending'}[s];
    const prev={s:st.states[k],l:st.late[k],r:st.reasons[k]};
    if(nx==='pending') delete st.states[k]; else st.states[k]=nx;
    if(nx==='late') st.late[k]=ahora(); else delete st.late[k];
    if(nx!=='absent') delete st.reasons[k];
    guardarEstado(m); render();
    const nom=(b.querySelector('.name')||{}).textContent||'';
    toast(nom+': '+EST[nx],'Deshacer',()=>{ if(UI.modo!==m) return;
      if(prev.s) st.states[k]=prev.s; else delete st.states[k];
      if(prev.l) st.late[k]=prev.l; else delete st.late[k];
      if(prev.r) st.reasons[k]=prev.r; else delete st.reasons[k];
      guardarEstado(m); render(); });
    return;
  }
  const a=b.dataset.act; if(!a) return;
  if(a==='inicio'){ UI.modo=null; render(); window.scrollTo(0,0); if(Date.now()-LS.get('pl_sync',0)>10*60e3) sincronizarResidentes(false); }
  if(a==='cargar') document.getElementById('fichero').click();
  if(a==='probar') probar();
  if(a==='reintentar') enviarCola();
  if(a==='enviar') enviarPase();
  if(a==='obsEnviar') enviarObs();
  if(a==='csv') descargarCSV();
  if(a==='print'){ document.body.classList.add('print-absent'); window.print(); }
  if(a==='sincronizar'){ sincronizarResidentes(true); return; }
  if(a==='avPoner'){ ponerAviso(); return; }
  if(a==='avCerrar'){ UI.avSel=null; render(); return; }
  if(a==='seguir'){ UI.sigue[UI.modo]=true; render(); }
  if(a==='nuevo'){ const m=UI.modo; if(!confirm('¿Dejar toda la lista en blanco para un pase nuevo?')) return;
    S[m]={states:{},reasons:{},late:{}}; guardarEstado(m); UI.sigue[m]=false; render(); window.scrollTo(0,0); toast('Lista en blanco: puedes empezar el pase'); }
  if(a==='reset'){
    const m=UI.modo,t=UI.tab[m]; if(!confirm(`¿Reiniciar el pase de ${ambito(m,t)}?`)) return;
    const keys=new Set(); grupos(m,t).forEach(g=>g.slots.forEach(p=>p&&keys.add(p.key)));
    for(const o of [S[m].states,S[m].reasons,S[m].late]) for(const k of Object.keys(o)) if(keys.has(k)) delete o[k];
    guardarEstado(m); render();
  }
  if(a==='borrar'&&confirm('¿Borrar los residentes y sus fotos de este móvil? Tendrás que volver a cargar el archivo para usar la app.')){
    await dbDel('datos'); await dbDel('casas'); H=null; C=null; render();
  }
});
document.addEventListener('change',e=>{
  const el=e.target, m=UI.modo;
  if(el.id==='avMot'){ UI.avMot=el.value; render(); return; }
  if(el.classList.contains('absence-reason')){ S[m].reasons[el.dataset.key]=el.value; guardarEstado(m); render(); }
  if(el.classList.contains('late-time')){ S[m].late[el.dataset.key]=el.value; guardarEstado(m); render(); }
  if(el.id==='fichero'&&el.files[0]){ cargarArchivo(el.files[0]); el.value=''; }
});
document.addEventListener('input',e=>{ if(e.target.id==='searchAv'){ UI.qa=e.target.value; UI.focoA=true; render(); return; } if(e.target.id==='avNota') UI.avNota=e.target.value; if(e.target.id==='avQuien') UI.avQuien=e.target.value; if(e.target.id==='obsTxt') OBS.texto=e.target.value; if(e.target.id==='obsNom') OBS.nombre=e.target.value; if(e.target.id==='obsTipo') OBS.tipo=e.target.value; if(e.target.id==='search'){ UI.q=e.target.value; UI.foco=true; render(); } });
window.addEventListener('afterprint',()=>document.body.classList.remove('print-absent'));
window.addEventListener('online',enviarCola);
setInterval(enviarCola,60000);

/* enlace de configuración: ?conectar=… */
(function(){ try{ const c=new URLSearchParams(location.search).get('conectar'); if(!c) return;
  const b=c.replace(/-/g,'+').replace(/_/g,'/'), j=JSON.parse(decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4)))));
  if(!j.u||!j.k) return; ENV.url=j.u; ENV.clave=j.k; guardarEnvio(); history.replaceState(null,'',location.pathname); UI.modo=null; UI.conectado=true;
}catch(e){} })();

(async()=>{
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{ H=await dbGet('datos')||null; }catch(e){ H=null; }
  try{ C=await dbGet('casas')||null; }catch(e){ C=null; }
  render();
  sincronizarResidentes(false);
  if(UI.conectado){ const el=document.getElementById('cfg'); if(el){ el.scrollIntoView({block:'start'}); const i=document.getElementById('env_movil'); i&&i.focus(); } toast('Dirección y clave puestas. Escribe el nombre del móvil y pulsa «Guardar y probar».'); }
  enviarCola();
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
