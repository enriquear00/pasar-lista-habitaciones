<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pasar Lista · Santa Espina</title>
  <style>
    body { font: 1.1rem/1.5 system-ui, sans-serif; margin: 8vh auto; max-width: 34rem; padding: 1.25rem; color: #182923; }
    a { color: #195643; }
  </style>
</head>
<body>
  <main>
    <h1>Pasar Lista</h1>
    <p id="estado">La aplicación se abre desde el servidor del Monasterio.</p>
    <p><a id="servidor" href="https://pasar-lista.tailacd344.ts.net/">Abrir Pasar Lista</a></p>
    <p><a href="./anterior.html">Consultar la versión anterior en este dispositivo</a></p>
  </main>
  <script>
    // Al publicar, conservar el index.html anterior como anterior.html en la misma carpeta.
    function hayTrabajoLocal() {
      const claves = ['pl_cola', 'attendanceRoomStates', 'casas_states', 'pl_ag_pend', 'pl_ag_lotes', 'pl_ag_texto'];
      return claves.some(clave => {
        const dato = localStorage.getItem(clave);
        if (!dato) return false;
        const valor = JSON.parse(dato);
        if (valor && typeof valor === 'object') return Object.keys(valor).length > 0;
        return Boolean(valor);
      });
    }

    const estado = document.getElementById('estado');
    try {
      if (hayTrabajoLocal()) {
        estado.textContent = 'Este dispositivo conserva marcas o envíos de la versión anterior. Puedes revisarlos allí antes de abrir la app del servidor.';
      } else if (navigator.onLine === false) {
        estado.textContent = 'Estás sin conexión. Si ya has usado la app del servidor en este dispositivo, prueba a abrirla.';
      } else {
        location.replace(document.getElementById('servidor').href);
      }
    } catch {
      estado.textContent = 'No se han podido comprobar los envíos guardados en este dispositivo. Puedes revisarlos en la versión anterior.';
    }
  </script>
</body>
</html>
